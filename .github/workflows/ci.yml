name: CI development

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Verificar tipos
        run: npx --no-install tsc --noEmit
