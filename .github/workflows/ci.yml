name: CI development

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Verificar arquitetura
        run: npm run lint:architecture

      - name: Verificar tipos
        run: npm run typecheck

      - name: Gerar Storybook
        run: npm run build-storybook

      - name: Executar testes
        run: npm test

      - name: Verificar contratos e contrastes do ODS
        run: node tests/ods-theme.test.cjs
