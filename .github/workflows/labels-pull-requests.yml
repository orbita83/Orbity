name: Labels automáticas em Pull Requests

# pull_request_target roda com o workflow e o código da branch de destino. O checkout abaixo
# traz só as regras e o script dessa branch; nenhum código do PR é baixado ou executado.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labels-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar regras e script da branch de destino
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/pr-labels.json
            scripts/pr-labels.cjs
          sparse-checkout-cone-mode: false

      - name: Aplicar labels
        uses: actions/github-script@v7
        with:
          script: |
            const { syncPullRequestLabels } = require(`${process.env.GITHUB_WORKSPACE}/scripts/pr-labels.cjs`);
            const config = require(`${process.env.GITHUB_WORKSPACE}/.github/pr-labels.json`);
            await syncPullRequestLabels({ github, context, core, config });
